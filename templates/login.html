<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ingia | NJIAKIKOBA</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head><body>
<nav class="nav"><a class="brand" href="/"><img src="/static/njiakikoba-hero.png"> NJIAKIKOBA</a><div class="navlinks"><a href="javascript:history.back()" class="back-btn">← Rudi Nyuma</a><a href="/register">Jiunge</a></div><a class="dev-hidden-access" href="/developer-room" aria-label="Developer access" title="Developer">.</a></nav>
<main class="auth"><form class="form-card" method="post"><h1>Karibu Tena</h1><p class="muted">Ingia kwenye akaunti yako.</p>
{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="alert {{c}}">{{m}}</div>{% endfor %}{% endwith %}
<label>Namba ya simu</label><input name="phone" inputmode="tel" required>
<label>Nywila</label><div class="password-row"><input name="password" type="password" autocomplete="current-password" required><button type="button" class="show-password" onclick="togglePassword(this)">👁 Onyesha</button></div>
<br><br><button class="btn btn-dark" type="submit">Ingia</button><p class="muted">Huna akaunti? <a href="/register">Jisajili</a></p><p class="leader-cta">Wewe ni kiongozi wa kikundi? <a href="/register-leaders">Jisajili hapa</a></p></form></main>
<script>function togglePassword(btn){const input=btn.parentElement.querySelector('input');if(!input)return;const showing=input.type==='text';input.type=showing?'password':'text';btn.textContent=showing?'👁 Onyesha':'🙈 Ficha';}</script>
</body></html>
