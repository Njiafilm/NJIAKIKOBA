<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>📞 Conference Call | NJIAKIKOBA</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07111f;color:#fff;font-family:Arial,sans-serif}
.header{height:64px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;background:#0b1728;border-bottom:1px solid #1d3048}
.brand{font-size:19px;font-weight:900}.status{font-size:12px;color:#b9c7d6}
.page{max-width:1200px;margin:auto;padding:12px}
.top{padding:8px 4px 12px}.top h1{margin:0;font-size:23px}.top p{margin:5px 0;color:#aebdcd;font-size:13px}
#meet{height:calc(100vh - 145px);min-height:540px;border-radius:15px;overflow:hidden;background:#000}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{display:block;flex:1;text-align:center;padding:12px;border-radius:10px;text-decoration:none;font-weight:900;background:#12823b;color:#fff}
.btn.secondary{background:#17283b;color:#fff;border:1px solid #2b425a}
@media(max-width:600px){
 .brand{font-size:16px}.page{padding:8px}.top h1{font-size:20px}
 #meet{height:calc(100vh - 150px);min-height:500px}
}
</style>
</head>
<body>
<header class="header">
  <div class="brand">📞 NJIAKIKOBA Conference</div>
  <div class="status">👤 {{ actor["full_name"] }}</div>
</header>

<main class="page">
  <div class="top">
    <h1>👥 Conference Call ya Kikundi</h1>
    <p>Washiriki wengi wanaweza kuingia kwenye call moja kwa wakati mmoja.</p>
  </div>

  <div id="meet"></div>

  <div class="actions">
    <a class="btn secondary" href="/group-chat">💬 Group Chat</a>
    <a class="btn" href="/group-chat">↩️ Toka kwenye Call</a>
  </div>
</main>

<script src="https://meet.jit.si/external_api.js"></script>
<script>
const api = new JitsiMeetExternalAPI("meet.jit.si", {
  roomName: {{ room_name|tojson }},
  width: "100%",
  height: "100%",
  parentNode: document.querySelector("#meet"),
  lang: "sw",
  userInfo: {displayName: {{ actor["full_name"]|tojson }},
             email: ""},
  configOverwrite: {
    prejoinConfig: {enabled:true},
    startWithAudioMuted:false,
    startWithVideoMuted:false,
    disableAP:true
  },
  interfaceConfigOverwrite: {
    TILE_VIEW_MAX_COLUMNS: 5,
    DISABLE_JOIN_LEAVE_NOTIFICATIONS:false
  }
});

api.addEventListener("readyToClose",()=>location.href="/group-chat");
</script>
</body>
</html>
