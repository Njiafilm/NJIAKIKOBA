<!doctype html>
<html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jiunge na Kikundi | NJIAKIKOBA</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}">
<style>.form-page{max-width:620px;margin:auto;padding:25px 14px}.card{background:#fff;border-radius:16px;padding:22px;border:1px solid #dce5df;box-shadow:0 8px 25px rgba(20,55,30,.08)}h1{color:#12321c}.hint{color:#617067;line-height:1.6}.field{margin:14px 0}.field label{display:block;font-weight:800;margin-bottom:6px;color:#20372a}.field input{width:100%;padding:12px;border:1px solid #bdc9c1;border-radius:9px;font-size:16px}.btn{width:100%;padding:13px;border:0;border-radius:10px;background:#0e7a34;color:#fff;font-weight:900;font-size:16px}</style></head><body>
<nav class="nav"><a class="brand" href="/">🔐 NJIAKIKOBA</a><div class="navlinks"><a href="javascript:history.back()" class="back-btn">← Rudi Nyuma</a><a href="/login">Ingia</a></div></nav>
<main class="form-page"><section class="card"><h1>👥 Jiunge na Kikundi</h1><p class="hint">Ingiza <strong>Registration Code</strong> uliyopewa na kikundi chako. Kila kikundi kina wanachama na taarifa zake tofauti.</p>
{% with ms=get_flashed_messages(with_categories=true) %}{% for c,m in ms %}<div class="alert {{c}}">{{m}}</div>{% endfor %}{% endwith %}
<form method="post"><div class="field"><label>Jina la Kikundi</label><input name="group_name" placeholder="Mfano: CHAPAKAZI GROUP" required></div><div class="field"><label>Registration Code</label><input name="group_code" placeholder="Mfano: NK-0001" required></div><div class="field"><label>Jina Kamili</label><input name="full_name" required></div><div class="field"><label>Namba ya Simu</label><input name="phone" required></div><div class="field"><label>Barua Pepe</label><input type="email" name="email"></div><div class="field"><label>Nywila</label><div class="password-row"><input type="password" name="password" autocomplete="new-password" minlength="8" required><button type="button" class="show-password" onclick="togglePassword(this)">👁 Onyesha</button></div></div><button class="btn">Jiunge na Kikundi</button></form></section></main><script>function togglePassword(btn){const input=btn.parentElement.querySelector('input');if(!input)return;const showing=input.type==='text';input.type=showing?'password':'text';btn.textContent=showing?'👁 Onyesha':'🙈 Ficha';}</script>
</body></html>
