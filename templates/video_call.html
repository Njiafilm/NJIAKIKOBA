<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>📹 Video Call | NJIAKIKOBA</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><style>body{background:#f4f7f5!important;color:#17231c!important}.call-page{max-width:1100px;margin:auto;padding:14px 10px 30px}.call-card{background:#fff;border:1px solid #dce5df;border-radius:16px;padding:12px;box-shadow:0 10px 30px rgba(20,55,30,.08)}.call-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 4px 12px}.call-head h1{margin:0;color:#12321c!important;font-size:23px}.call-head p{margin:4px 0 0;color:#617067!important;font-size:13px}.live-badge{display:inline-flex;align-items:center;gap:6px;background:#b42318;color:#fff;padding:7px 11px;border-radius:999px;font-size:12px;font-weight:900}.live-dot{width:8px;height:8px;background:#fff;border-radius:50%;animation:blink 1s infinite}@keyframes blink{50%{opacity:.25}}#meet{width:100%;height:min(76vh,760px);min-height:520px;border-radius:13px;overflow:hidden;background:#0b1118}.call-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.call-btn{display:inline-block;text-decoration:none;border:0;border-radius:9px;padding:11px 14px;font-weight:800;background:#0e7a34;color:#fff!important;cursor:pointer}.call-btn.secondary{background:#eef2ef;color:#183022!important;border:1px solid #d6dfd9}.voice-status{font-size:13px;font-weight:800;color:#0e7a34;margin-top:8px}@media(max-width:600px){.call-page{padding:8px}.call-head{display:block}.live-badge{margin-top:8px}#meet{height:72vh;min-height:480px}.call-btn{width:100%;text-align:center}}</style></head><body><div style="padding:10px 5%"><a class="back-btn" href="javascript:history.back()">← Rudi Nyuma</a></div><nav class="nav"><a class="brand" href="/">🔐 NJIAKIKOBA</a><div class="navlinks"><a class="back-btn" href="/group-chat">← Chat</a><a href="/logout">Toka</a></div></nav><main class="call-page"><section class="call-card"><div class="call-head"><div><h1>📹 Video Call ya Kikundi</h1><p>{{ group["group_name"] }} · {{ actor["full_name"] }}</p></div><span class="live-badge" id="liveBadge"><span class="live-dot"></span> LIVE</span></div><div id="meet"></div><div class="call-actions"><button class="call-btn" id="hdBtn" type="button">🎥 HD: ON</button><button class="call-btn" id="voiceBtn" type="button">🎙️ Tuma Sauti kwa Kikundi</button><a class="call-btn secondary" href="/group-chat">💬 Rudi Group Chat</a></div><div class="voice-status" id="voiceStatus"></div></section></main><script src="https://meet.jit.si/external_api.js"></script><script>const domain='meet.jit.si';const api=new JitsiMeetExternalAPI(domain,{roomName:{{ room_name|tojson }},width:'100%',height:'100%',parentNode:document.querySelector('#meet'),lang:'sw',userInfo:{displayName:{{ actor['full_name']|tojson }}},configOverwrite:{prejoinConfig:{enabled:true},startWithAudioMuted:false,startWithVideoMuted:false,videoQuality:{preferredCodec:'VP9'}},interfaceConfigOverwrite:{DISABLE_JOIN_LEAVE_NOTIFICATIONS:false,TILE_VIEW_MAX_COLUMNS:4}});api.addEventListener('readyToClose',()=>location.href='/group-chat');let hd=true;document.getElementById('hdBtn').onclick=()=>{hd=!hd;try{api.executeCommand('setVideoQuality',hd?720:360);}catch(e){}document.getElementById('hdBtn').textContent='🎥 HD: '+(hd?'ON':'OFF');};let rec=null,chunks=[],stream=null;document.getElementById('voiceBtn').onclick=async()=>{const status=document.getElementById('voiceStatus');if(rec&&rec.state==='recording'){rec.stop();return;}try{stream=await navigator.mediaDevices.getUserMedia({audio:true});const mime=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':'audio/webm';rec=new MediaRecorder(stream,{mimeType:mime});chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());const blob=new Blob(chunks,{type:mime});const fd=new FormData();fd.append('voice',new File([blob],'meeting-voice.webm',{type:mime}));status.textContent='⏳ Inatuma ujumbe wa sauti...';try{const r=await fetch('/group-chat/voice',{method:'POST',body:fd});const data=await r.json();status.textContent=data.ok?'✓ Ujumbe wa sauti umetumwa kwa wanakikundi.':'❌ '+data.message;}catch(e){status.textContent='❌ Imeshindwa kutuma ujumbe wa sauti.';}document.getElementById('voiceBtn').textContent='🎙️ Tuma Sauti kwa Kikundi';};rec.start();status.textContent='● Inarekodi... bonyeza tena kumaliza.';document.getElementById('voiceBtn').textContent='⏹️ Maliza & Tuma';}catch(e){status.textContent='❌ Ruhusa ya microphone imekataliwa.';}};</script></body></html>
