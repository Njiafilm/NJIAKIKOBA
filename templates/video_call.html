<!doctype html>
<html lang="sw">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>📹 Video Call | NJIAKIKOBA</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body{background:#f4f7f5!important;color:#17231c!important}
    .call-page{max-width:1100px;margin:auto;padding:14px 10px 30px}
    .call-card{background:#fff;border:1px solid #dce5df;border-radius:16px;padding:12px;box-shadow:0 10px 30px rgba(20,55,30,.08)}
    .call-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 4px 12px}
    .call-head h1{margin:0;color:#12321c!important;font-size:23px}
    .call-head p{margin:4px 0 0;color:#617067!important;font-size:13px}
    #meet{width:100%;height:min(76vh,760px);min-height:520px;border-radius:13px;overflow:hidden;background:#0b1118}
    .call-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .call-btn{display:inline-block;text-decoration:none;border:0;border-radius:9px;padding:11px 14px;font-weight:800;background:#0e7a34;color:#fff!important}
    .call-btn.secondary{background:#eef2ef;color:#183022!important;border:1px solid #d6dfd9}
    @media(max-width:600px){
      .call-page{padding:8px}
      .call-head{display:block}
      #meet{height:72vh;min-height:480px}
      .call-btn{width:100%;text-align:center}
    }
  </style>
</head>
<body>
<nav class="nav">
  <a class="brand" href="/">🔐 NJIAKIKOBA</a>
  <div class="navlinks">
    <a class="back-btn" href="/group-chat">← Chat</a>
    <a href="/logout">Toka</a>
  </div>
</nav>

<main class="call-page">
  <section class="call-card">
    <div class="call-head">
      <div>
        <h1>📹 Video Call ya Kikundi</h1>
        <p>{{ group["group_name"] }} · {{ actor["full_name"] }}</p>
      </div>
    </div>

    <div id="meet"></div>

    <div class="call-actions">
      <a class="call-btn secondary" href="/group-chat">💬 Rudi Group Chat</a>
    </div>
  </section>
</main>

<script src="https://meet.jit.si/external_api.js"></script>
<script>
  const domain = "meet.jit.si";
  const options = {
    roomName: {{ room_name|tojson }},
    width: "100%",
    height: "100%",
    parentNode: document.querySelector("#meet"),
    lang: "sw",
    userInfo: {
      displayName: {{ actor["full_name"]|tojson }}
    },
    configOverwrite: {
      prejoinConfig: { enabled: true },
      startWithAudioMuted: false,
      startWithVideoMuted: false
    },
    interfaceConfigOverwrite: {
      DISABLE_JOIN_LEAVE_NOTIFICATIONS: false,
      TILE_VIEW_MAX_COLUMNS: 4
    }
  };

  const api = new JitsiMeetExternalAPI(domain, options);

  api.addEventListener("readyToClose", function () {
    window.location.href = "/group-chat";
  });

  api.addEventListener("cameraError", function () {
    console.warn("Camera error");
  });

  api.addEventListener("micError", function () {
    console.warn("Microphone error");
  });
</script>
</body>
</html>
